<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:">
  <title>Safari Old Version Simulator</title>
  <link rel="stylesheet" href="styles.css">
  <script src="renderer.js" defer></script>
</head>
<body>
  <main class="app">
    <div class="eyebrow">WEBKIT TESTING TOOL</div>
    <h1>Safari Old Version Simulator</h1>
    <p class="intro">Choose a Safari target. The app opens the matching Playwright WebKit browser.</p>

    <section class="panel" aria-label="Browser settings">
      <label for="version">Safari version</label>
      <select id="version"></select>
      <div id="version-detail" class="detail"></div>

      <div id="approximation" class="approximation" hidden>
        <label class="check-row" for="allow-approximation">
          <input id="allow-approximation" type="checkbox">
          <span>I understand this is an approximate WebKit match.</span>
        </label>
      </div>

      <label for="url" class="url-label">URL to open</label>
      <input id="url" type="text" inputmode="url" autocomplete="url" spellcheck="false" placeholder="https://example.com or about:blank">
      <p class="hint">For local sites, try http://localhost:3000</p>

      <div class="actions">
        <button id="launch" class="primary" type="button">Open browser</button>
        <button id="close" class="secondary" type="button" hidden>Close browser</button>
      </div>
    </section>

    <div class="status" role="status" aria-live="polite">
      <span id="status-dot" class="status-dot"></span>
      <span id="status-text">Loading…</span>
    </div>
    <p class="footnote">This tool does not launch Safari.app. Older WebKit builds may not run on every macOS version.</p>
  </main>
</body>
</html>
